# The toolkit's one native library: the parts a program needs, by feature (text, mermaid, a11y, webp, pdf), linked as one
# static library with one copy of Rust's standard library (tools/tk build_native -features:...). Each part stays a crate
# of its own (native/text, native/mermaid, native/a11y, native/webp): a program with a Rust library of its own builds the
# crate it needs into it (FONT_NATIVE_LINK=false...), as before.
[package]
name = "gt_native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[features]
text = ["dep:gt_text"]
mermaid = ["dep:gt_mermaid"]
a11y = ["dep:gt_a11y"]
webp = ["dep:gt_webp"]
pdf = ["dep:gt_pdf"]

[dependencies]
gt_text = { path = "../text", optional = true }
gt_mermaid = { path = "../mermaid", optional = true }
gt_a11y = { path = "../a11y", optional = true }
gt_webp = { path = "../webp", optional = true }
gt_pdf = { path = "../pdf", optional = true }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = false
panic = "unwind"   # every entry point of every part catches panics: a part that fails is a thing not shown, not a dead app
incremental = false

# (a diagram takes milliseconds; the size of Mermaid's code is what every program that draws one pays)
[profile.release.package.mermaid-svg]
opt-level = "s"
[profile.release.package.gt_mermaid]
opt-level = "s"
