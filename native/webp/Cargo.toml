# The toolkit's WebP (src/image/webp.odin): libwebp's own C sources, sharpyuv's with them, built by libwebp-sys with the
# target's compiler (MSVC on Windows), so no prebuilt archive is needed (the official one's static libwebp.lib calls
# SharpYuv*, which it does not ship) and no system libwebp either. A part of the one native library (native/gt, feature
# webp: tools/tk build_native -features:webp), so a program that writes WebP carries it inside. Versions pinned here and by
# Cargo.lock; the build runs with --locked. See src/md/features/image-decode.md.
[package]
name = "gt_webp"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib"]   # (linked into native/gt's static library; its release profile is native/gt's)
path = "src/lib.rs"

[dependencies]
libwebp-sys = { version = "=0.14.4", default-features = false, features = ["std"] }
