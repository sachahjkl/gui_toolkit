name: Odin and MSVC
description: Odin dev-2026-11a (pinned by SHA-256) on the PATH, and the MSVC x64 environment (link.exe, rc.exe)

runs:
  using: composite
  steps:
    - name: Odin dev-2026-11a
      shell: pwsh
      env:
        # odin version: dev-2026-11-nightly:9a69916 (the tag dev-2026-11a is that commit; the archives of dev-2026-11 are the same files)
        ODIN_TAG: dev-2026-11a
        ODIN_SHA256: 259effedf2997293c8fa4a5e497496f8ebce9f826652d9dd353a9dd2113c31fd
      run: |
        $zip = Join-Path $env:RUNNER_TEMP "odin-$env:ODIN_TAG.zip"
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest "https://github.com/odin-lang/Odin/releases/download/$env:ODIN_TAG/odin-windows-amd64-$env:ODIN_TAG.zip" -OutFile $zip
        # (.NET, not Get-FileHash: the cmdlet was "not recognized" in a runner's step)
        $h = [Security.Cryptography.SHA256]::Create()
        $s = [IO.File]::OpenRead($zip)
        try { $got = ([BitConverter]::ToString($h.ComputeHash($s)) -replace '-', '').ToLower() } finally { $s.Dispose(); $h.Dispose() }
        if ($got -ne $env:ODIN_SHA256) { throw "Odin archive SHA-256 mismatch: $got" }
        $dir = Join-Path $env:RUNNER_TEMP 'odin'
        Expand-Archive $zip -DestinationPath $dir -Force
        Add-Content $env:GITHUB_PATH (Join-Path $dir 'dist')
        & (Join-Path $dir 'dist\odin.exe') version

    # The MSVC x64 environment (link.exe, rc.exe, the Windows SDK) for the steps after this one: vcvars64.bat of the newest
    # Visual Studio with the C++ tools (vswhere), its environment written to GITHUB_ENV / GITHUB_PATH. (Done here rather
    # than with ilammy/msvc-dev-cmd, whose releases still run on Node 20, which the runners deprecate.)
    - name: MSVC x64 environment
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw 'no Visual Studio with the C++ x64 tools' }
        $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
        $before = @{}
        Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
        $lines = cmd /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE) { throw "vcvars64.bat failed ($LASTEXITCODE)" }
        foreach ($l in $lines) {
          $i = $l.IndexOf('=')
          if ($i -le 0) { continue }
          $name, $value = $l.Substring(0, $i), $l.Substring($i + 1)
          if ($before[$name] -eq $value) { continue }
          if ($name -eq 'Path') {
            # only the folders vcvars put in front
            $old = $before['Path'] -split ';'
            $value -split ';' | Where-Object { $_ -and $old -notcontains $_ } | ForEach-Object { Add-Content $env:GITHUB_PATH $_ }
          } else {
            "$name<<__VCVARS_EOF__`n$value`n__VCVARS_EOF__" | Add-Content $env:GITHUB_ENV
          }
        }
        Write-Host "MSVC from $vs"
