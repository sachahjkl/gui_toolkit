name: Release

# The programs of a release: when `tk release` publishes a GitHub release, the examples meant to be shown
# (tools/tk/demos.odin) are built for Windows x64 from its tag and attached to it, one zip each (tk demos), with
# gt-runtime-windows-x64.zip and gt-skills.zip, the agent skills with that tag's references (tools/tk/skills.odin); and
# gt-file-picker for Windows and Linux (tk file_picker_package: gt-file-picker-windows-x64.zip,
# gt-file-picker-linux-x64.tar.gz). A manual run with a tag attaches them to a release that is already out (one published
# before this workflow, or a failed run).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (v<version>)
        required: true

permissions:
  contents: write

jobs:
  demos:
    name: Demo programs (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: ./.github/actions/setup-odin

      # (the demos need no native library nor shader step on Windows: DirectWrite and D3D11, the DXBC is in the sources)
      - name: The demos (tk demos)
        shell: pwsh
        timeout-minutes: 12
        # (odin build, not odin run: run deletes the executable it made, and the next step runs it again)
        run: New-Item -ItemType Directory -Force build | Out-Null; odin build tools/tk -vet -out:build/tk.exe; if ($LASTEXITCODE) { exit 1 }; ./build/tk.exe demos -out:build/demos

      - name: gt-file-picker (tk file_picker_package)
        shell: pwsh
        timeout-minutes: 5
        run: ./build/tk.exe file_picker_package -out:build/demos

      - name: Attach them to the release
        shell: pwsh
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload $env:TAG (Get-ChildItem build/demos/*.zip).FullName --clobber

  file-picker-linux:
    name: gt-file-picker (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - uses: actions/cache@v6
        with:
          path: |
            build/native
          key: native-linux-nix-${{ hashFiles('native/**', 'flake.lock') }}

      # (in the flake's shell, as the CI's Linux job: the pinned Odin with wgpu-native, Rust for the native library, patchelf)
      - name: gt-file-picker (tk file_picker_package)
        run: |
          nix develop --command sh -c '
            set -e
            mkdir -p build
            odin build tools/tk -vet -out:build/tk
            build/tk fetch_wgpu
            build/tk file_picker_package -out:build/release
          '

      - name: Attach it to the release
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" build/release/gt-file-picker-linux-x64.tar.gz --clobber
