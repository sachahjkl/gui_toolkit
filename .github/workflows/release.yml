name: Release

# The demo programs of a release: when `tk release` publishes a GitHub release, the examples meant to be shown
# (tools/tk/demos.odin) are built for Windows x64 from its tag and attached to it, one zip each (tk demos). A manual run
# with a tag attaches them to a release that is already out (one published before this workflow, or a failed run).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (v<version>)
        required: true

permissions:
  contents: write

jobs:
  demos:
    name: Demo programs (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: ./.github/actions/setup-odin

      # (the demos need no native library nor shader step on Windows: DirectWrite and D3D11, the DXBC is in the sources)
      - name: The demos (tk demos)
        shell: pwsh
        timeout-minutes: 12
        run: New-Item -ItemType Directory -Force build | Out-Null; odin run tools/tk -vet -out:build/tk.exe -- demos -out:build/demos

      - name: Attach them to the release
        shell: pwsh
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload $env:TAG (Get-ChildItem build/demos/*.zip).FullName --clobber
