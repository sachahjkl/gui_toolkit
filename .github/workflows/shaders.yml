# Writes the Direct3D 11 shaders of a branch (HLSL by naga, DXBC by D3DCompile: tools/shaders) and commits them to it.
# D3DCompile exists only on Windows: a WGSL change made on Linux gets its HLSL and DXBC here, and the blobs of the
# application shaders built from rect.wgsl too: the test's (tests/appshaders) and the licence card's (src/ui/shaders).
#   gh workflow run shaders.yml --ref <branch>
name: Shaders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shaders:
    name: Write the Direct3D 11 shaders
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-odin

      - name: Write them (tools/tk build_naga, tools/shaders)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin run tools/tk -vet -out:build/tk.exe -- build_naga
          if ($LASTEXITCODE) { exit 1 }
          odin run tools/shaders -vet -out:build/shaders_tool.exe
          if ($LASTEXITCODE) { exit 1 }
          # the test's application shader: its blob is built from rect.wgsl too (tests/appshaders)
          odin run tools/shaders -vet -out:build/shaders_tool.exe -- app test tests/appshaders/test.wgsl tests/appshaders/shaders
          if ($LASTEXITCODE) { exit 1 }
          # the licence card's application shader (ui.licence_card): without its blob, Direct3D 11 draws the card flat
          New-Item -ItemType Directory -Force src/ui/shaders | Out-Null
          odin run tools/shaders -vet -out:build/shaders_tool.exe -- app licence_card src/ui/licence_card.wgsl src/ui/shaders
          if ($LASTEXITCODE) { exit 1 }

      - name: Commit what changed
        shell: pwsh
        run: |
          git add src/render/shaders tests/appshaders/shaders src/ui/shaders
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "the shaders were up to date"; exit 0 }
          git -c user.name=sachahjkl -c user.email=sacha@sacha.house commit -m "render: the Direct3D 11 shaders written from the WGSL (shaders.yml)"
          git push origin HEAD:${{ github.ref_name }}
