# Publishes site/ (plain HTML and CSS, no build step) to GitHub Pages: https://sachahjkl.github.io/gui_toolkit/
# Pages use the "GitHub Actions" source (set once: gh api -X POST repos/sachahjkl/gui_toolkit/pages -f build_type=workflow).
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "tools/site_changelog.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: node tools/site_changelog.mjs site _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
