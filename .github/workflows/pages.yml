# Publishes site/ (plain HTML and CSS, its pages made by tk site_build) to GitHub Pages: https://gt.sacha.house/
# Pages use the "GitHub Actions" source (set once: gh api -X POST repos/sachahjkl/gui_toolkit/pages -f build_type=workflow).
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "CHANGELOG.md"
      - "docs/**"
      - "tools/tk/**"
      - "src/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # the site, made by tk (Odin, the same pinned archive as the Linux job of ci.yml): the changelog's pages, what each page says
      # when shared, the Docs section
      - name: Odin dev-2026-11a
        env:
          ODIN_TAG: dev-2026-11a
          ODIN_SHA256: 65c9f6e97d6f8a30930e151f270ce5aeaa98fe8b2ba49fe067394e2af04f7618
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-linux-amd64-$ODIN_TAG.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"
      - run: mkdir -p build && odin run tools/tk -out:build/tk -- site_build site _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
