name: CI

# Four kinds of jobs, all in parallel (a push to master gives its verdict in about 6 minutes, 12 at most):
#   build      CHANGELOG fragments, the examples, the shaders (HLSL from WGSL, DXBC)
#   tests      the test packages that need no window of their own (D3D11 on WARP), native text, UI Automation
#   linux      odin check of every package for Linux, the examples built, the windowless tests (tools/linux_ci.sh)
#   wgpu       the WebGPU backend on WARP, one test at a time: every package on a push to master or a manual run, split in
#              four groups of about 4 minutes (tools/test_backends.ps1 -Group ci1..ci4); a pull request runs the 'sample'
#              group only (Slug text, video, filters and blends, layers), its full run comes with the merge into master.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# a newer push to a pull request replaces its run; every push to master keeps its own run (a verdict per commit)
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (changelog, examples, shaders)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # a few seconds: every fragment of changelog.d is well formed and none was already released, ui/version.odin is
      # the last published version (only tools/release.ps1 writes it); then the script's own tests
      - name: CHANGELOG fragments (tools/changelog.ps1 -Check)
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./tools/changelog.ps1 -Check
          if ($LASTEXITCODE) { exit 1 }
          ./tools/changelog_test.ps1
          if ($LASTEXITCODE) { exit 1 }

      - uses: ./.github/actions/setup-odin

      - name: Build the examples
        shell: cmd
        timeout-minutes: 6
        run: |
          for %%e in (hello fidget todo smoke transforms effects) do (call build.bat %%e || exit /b 1)

      # naga's translator is rebuilt only when its sources change (build_naga.ps1 compares its stamp)
      - name: Cache the WGSL to HLSL translator
        uses: actions/cache@v6
        with:
          path: |
            build/naga/wgsl2hlsl.exe
            build/naga/wgsl2hlsl.sources
          key: naga-${{ hashFiles('tools/wgsl2hlsl/Cargo.toml', 'tools/wgsl2hlsl/Cargo.lock', 'tools/wgsl2hlsl/src/**', 'tools/build_naga.ps1') }}

      - name: "Shaders (WGSL is the source; naga writes the HLSL, compiled to the DXBC the exes embed)"
        shell: pwsh
        timeout-minutes: 8
        run: |
          ./tools/build_naga.ps1
          if ($LASTEXITCODE) { exit 1 }
          odin run tools/shaders -vet -out:build/shaders_tool.exe -- -check
          if ($LASTEXITCODE) { exit 1 }

  tests:
    name: Tests (no window; pixel tests on WARP)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-odin

      # the Rust static libraries (native text backend, AccessKit adapter): their build scripts skip the build when the
      # STAMP next to the library matches the sources, so a stale restore only means a rebuild
      - name: Cache the native libraries and the emoji font
        uses: actions/cache@v6
        with:
          path: |
            build/text/gt_text.lib
            build/text/STAMP
            build/a11y/gt_a11y.lib
            build/a11y/STAMP
            build/emoji
          key: native-${{ hashFiles('native/**', 'tools/build_text.ps1', 'tools/build_a11y.ps1', 'tools/fetch_emoji.ps1') }}
          restore-keys: native-

      - name: "Emoji font (Noto Color Emoji COLR v1 and Unicode's emoji data, pinned by SHA-256, for tests/colr)"
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./tools/fetch_emoji.ps1 -Unicode
          if ($LASTEXITCODE) { exit 1 }

      # fat LTO makes a cold build of the two Rust libraries slow (the cache is saved only when the job succeeds: this step has its
      # own, long limit so that a cold run can end and fill it; with the cache the step takes seconds)
      - name: Native libraries (text backend, AccessKit adapter)
        shell: pwsh
        timeout-minutes: 30
        run: |
          ./tools/build_text.ps1
          if ($LASTEXITCODE) { exit 1 }
          ./tools/build_a11y.ps1
          if ($LASTEXITCODE) { exit 1 }

      - name: Tests
        shell: pwsh
        timeout-minutes: 12
        run: |
          ./tools/test_windowless.ps1
          if ($LASTEXITCODE) { exit 1 }

  # Linux: odin check -vet of every package, the examples built (native text, Vulkan through wgpu-native), the tests that
  # need no window (tools/linux_ci.sh). Odin and wgpu-native pinned by SHA-256, crates by Cargo.lock.
  linux:
    name: Linux (check, examples, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Odin dev-2026-10, clang, fontconfig
        env:
          ODIN_TAG: dev-2026-10
          ODIN_SHA256: c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld libfontconfig-dev unzip
          curl -fsSL -o "$RUNNER_TEMP/odin.tar.gz" "https://github.com/odin-lang/Odin/releases/download/$ODIN_TAG/odin-linux-amd64-$ODIN_TAG.tar.gz"
          echo "$ODIN_SHA256  $RUNNER_TEMP/odin.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf "$RUNNER_TEMP/odin.tar.gz" -C "$RUNNER_TEMP/odin"
          dirname "$(find "$RUNNER_TEMP/odin" -maxdepth 3 -name odin -type f | head -1)" >> "$GITHUB_PATH"

      - name: wgpu-native (tools/fetch_wgpu.sh)
        run: tools/fetch_wgpu.sh odin

      - uses: actions/cache@v6
        with:
          path: |
            build/text
            ~/.cargo/registry
          key: text-linux-${{ hashFiles('native/text/**') }}

      - name: Check, examples, tests (tools/linux_ci.sh)
        run: tools/linux_ci.sh odin

  wgpu:
    name: WebGPU (${{ matrix.group }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(github.event_name == 'pull_request' && '["sample"]' || '["ci1", "ci2", "ci3", "ci4"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-odin

      # DXC next to the test programs: wgpu compiles the shaders with it in 0.3 s instead of FXC's 2.8 s (a third of the
      # time of a package on WARP); FXC, the fallback when the DLLs are missing, is still run on two packages (ci4)
      - name: Cache DXC
        uses: actions/cache@v6
        with:
          path: |
            build/dxcompiler.dll
            build/dxil.dll
            build/dxc.version
          key: dxc-${{ hashFiles('tools/fetch_wgpu.ps1') }}

      - name: wgpu-native and DXC (tools/fetch_wgpu.ps1)
        shell: pwsh
        timeout-minutes: 4
        run: |
          ./tools/fetch_wgpu.ps1
          if ($LASTEXITCODE) { exit 1 }

      - name: Emoji font (for tests/colr)
        if: matrix.group == 'ci1'
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./tools/fetch_emoji.ps1 -Unicode
          if ($LASTEXITCODE) { exit 1 }

      - name: Build examples/smoke with the WebGPU backend
        if: matrix.group == 'ci1' || matrix.group == 'sample'
        shell: pwsh
        timeout-minutes: 4
        run: |
          odin build examples/smoke -vet -define:TOOLKIT_RENDER=wgpu -out:build/smoke_wgpu.exe -subsystem:windows
          if ($LASTEXITCODE) { exit 1 }

      - name: Tests, WebGPU backend (wgpu-native over Direct3D 12 on WARP, one test at a time)
        shell: pwsh
        timeout-minutes: 11
        run: |
          ./tools/test_backends.ps1 -Backend wgpu -Group ${{ matrix.group }} -TimeoutSec 420
          if ($LASTEXITCODE) { exit 1 }

      - name: Tests, WebGPU backend with FXC (no DXC)
        if: matrix.group == 'ci4'
        shell: pwsh
        timeout-minutes: 4
        run: |
          ./tools/test_backends.ps1 -Backend wgpu -Only text,shaders -Define TOOLKIT_WGPU_DX12_COMPILER=fxc -TimeoutSec 180
          if ($LASTEXITCODE) { exit 1 }

      - name: Logs of the WebGPU tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wgpu-logs-${{ matrix.group }}
          path: build/test_wgpu_*.log*
          retention-days: 7
