name: CI

# Four kinds of jobs, all in parallel (a push to master gives its verdict in about 6 minutes, 12 at most):
#   build      CHANGELOG fragments, the examples, the shaders (HLSL from WGSL, DXBC)
#   tests      every test package (tools/run_tests: D3D11 on WARP), native text, UI Automation, on a desktop of its own
#   linux      odin check of every package for Linux, the examples built, the tests (tk ci), the
#              backends on a virtual desktop (tk desktop_tests)
#   wgpu       the WebGPU backend on WARP, one test at a time: every package on a push to master or a manual run, split in
#              four groups of about 4 minutes (tools/run_tests -backend:wgpu -group:ci1..ci4); a pull request runs the 'sample'
#              group only (Slug text, video, filters and blends, layers), its full run comes with the merge into master.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# a newer push to a pull request replaces its run; every push to master keeps its own run (a verdict per commit)
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (changelog, examples, shaders)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-odin

      # what the documentation names must exist
      - name: Documentation (tk doc_check)
        shell: pwsh
        timeout-minutes: 3
        run: New-Item -ItemType Directory -Force build | Out-Null; odin run tools/tk -vet -out:build/tk.exe -- doc_check

      # a few seconds: every fragment of changelog.d is well formed and none was already released, ui/version.odin is
      # the last published version (only `tk release` writes it). (tests/changelog tests the tool, with the other packages.)
      - name: CHANGELOG fragments (tools/changelog)
        timeout-minutes: 3
        run: New-Item -ItemType Directory -Force build | Out-Null; odin run tools/changelog -vet -out:build/changelog.exe -- -check

      - name: Build the examples
        shell: cmd
        timeout-minutes: 6
        run: |
          for %%e in (hello fidget todo smoke transforms effects docking) do (odin run tools/tk -out:build/tk.exe -- build %%e || exit /b 1)

      # naga's translator is rebuilt only when its sources change (tools/tk build_naga compares its stamp)
      - name: Cache the WGSL to HLSL translator
        uses: actions/cache@v6
        with:
          path: |
            build/naga/wgsl2hlsl.exe
            build/naga/wgsl2hlsl.sources
          key: naga-${{ hashFiles('tools/wgsl2hlsl/Cargo.toml', 'tools/wgsl2hlsl/Cargo.lock', 'tools/wgsl2hlsl/src/**', 'tools/tk/**') }}

      - name: "Shaders (WGSL is the source; naga writes the HLSL, compiled to the DXBC the exes embed)"
        shell: pwsh
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin run tools/tk -vet -out:build/tk.exe -- build_naga
          if ($LASTEXITCODE) { exit 1 }
          odin run tools/shaders -vet -out:build/shaders_tool.exe -- -check
          if ($LASTEXITCODE) { exit 1 }

  tests:
    name: Tests (no window; pixel tests on WARP)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-odin

      # the Rust static libraries (native text backend, AccessKit adapter): their build scripts skip the build when the
      # STAMP next to the library matches the sources, so a stale restore only means a rebuild
      - name: Cache the native libraries and the emoji font
        uses: actions/cache@v6
        with:
          path: |
            build/text/gt_text.lib
            build/text/STAMP
            build/a11y/gt_a11y.lib
            build/a11y/STAMP
            build/mermaid/gt_mermaid.lib
            build/mermaid/STAMP
            build/emoji
          key: native-${{ hashFiles('native/**', 'tools/tk/**') }}
          restore-keys: native-

      # (tools/tk: the toolkit's build and fetch commands, one Odin program)
      - name: tools/tk
        shell: pwsh
        timeout-minutes: 3
        run: New-Item -ItemType Directory -Force build | Out-Null; odin build tools/tk -vet -out:build/tk.exe

      - name: "Emoji font (Noto Color Emoji COLR v1 and Unicode's emoji data, pinned by SHA-256, for tests/colr)"
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./build/tk.exe fetch_emoji -unicode
          if ($LASTEXITCODE) { exit 1 }

      # fat LTO makes a cold build of the two Rust libraries slow (the cache is saved only when the job succeeds: this step has its
      # own, long limit so that a cold run can end and fill it; with the cache the step takes seconds)
      - name: Native libraries (text backend, AccessKit adapter, Mermaid diagrams)
        shell: pwsh
        timeout-minutes: 30
        run: |
          ./build/tk.exe build_text
          if ($LASTEXITCODE) { exit 1 }
          ./build/tk.exe build_a11y
          if ($LASTEXITCODE) { exit 1 }
          ./build/tk.exe build_mermaid
          if ($LASTEXITCODE) { exit 1 }

      - name: Tests (tools/run_tests)
        timeout-minutes: 14
        run: New-Item -ItemType Directory -Force build | Out-Null; odin run tools/run_tests -vet -out:build/run_tests.exe

      # the timelines of src/cdp against examples/whatsnew as a program of its own, over a real socket
      - name: The timelines (tk timeline_test)
        shell: pwsh
        timeout-minutes: 3
        run: |
          odin build examples/whatsnew -vet -define:TOOLKIT_DEVTOOLS=true -out:build/whatsnew.exe
          if ($LASTEXITCODE) { exit 1 }
          ./build/tk.exe timeline_test
          if ($LASTEXITCODE) { exit 1 }

      # the console launcher (tools/console_launcher) beside a console program of its own (tk.exe): what it gives is what the
      # program gives, its output and its exit code, through a pipe
      - name: The console launcher (tools/console_launcher)
        shell: pwsh
        timeout-minutes: 3
        run: |
          odin build tools/console_launcher -vet -subsystem:console -o:size -out:build/tk.com '-define:LAUNCHER_MARK=(tk console launcher)' -define:LAUNCHER_DEFAULT=wait
          if ($LASTEXITCODE) { exit 1 }
          $direct = (./build/tk.exe help 2>&1 | Out-String); $code = $LASTEXITCODE
          $launched = (./build/tk.com help 2>&1 | Out-String); $lcode = $LASTEXITCODE
          if ($direct -ne $launched -or $code -ne $lcode) { Write-Host "tk.exe: $code`n$direct`ntk.com: $lcode`n$launched"; exit 1 }
          ./build/tk.com no-such-command *> $null; $bad = $LASTEXITCODE
          ./build/tk.exe no-such-command *> $null
          if ($bad -ne $LASTEXITCODE -or $bad -eq 0) { Write-Host "an unknown command: tk.com $bad, tk.exe $LASTEXITCODE"; exit 1 }
          if (-not (Select-String -Path build/tk.com -Pattern '(tk console launcher)' -SimpleMatch -Quiet)) { Write-Host 'the mark is not in tk.com'; exit 1 }
          exit 0   # (the step's code would be the last program's: tk.exe's 2 for the unknown command, on purpose)

      # what a test leaves when it fails: the frame, the tree of boxes, a page that differs from its reference image
      - name: Keep what failed tests left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: session-images
          path: build/session
          if-no-files-found: ignore

  # Linux: odin check -vet of every package, the examples built (native text, Vulkan through wgpu-native), the tests that
  # need no window (tk ci), the backends on a virtual desktop (tk desktop_tests). In the flake's development shell (nix
  # develop), as on a developer's machine: Odin, Rust, Mesa, Xorg, sway and the rest from the NixOS cache, no distribution's
  # package mirror in the way (Ubuntu's DNS failed for hours). On the runner itself: Xorg starts through sudo, sway will not
  # start as root.
  linux:
    name: Linux (check, examples, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - uses: actions/cache@v6
        with:
          path: |
            build/text
            build/mermaid
          key: native-linux-nix-${{ hashFiles('native/text/**', 'native/mermaid/**', 'flake.lock') }}

      # (the shell's dbus reads its session bus's configuration where NixOS keeps it, /etc/dbus-1, which this runner does not
      # have: a session bus of its own for sway's dbus-run-session)
      - name: dbus's session configuration
        run: |
          sudo mkdir -p /etc/dbus-1
          sudo tee /etc/dbus-1/session.conf >/dev/null <<'EOF'
          <!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
           "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
          <busconfig>
            <type>session</type>
            <listen>unix:tmpdir=/tmp</listen>
            <auth>EXTERNAL</auth>
            <policy context="default">
              <allow send_destination="*" eavesdrop="true"/>
              <allow eavesdrop="true"/>
              <allow own="*"/>
            </policy>
          </busconfig>
          EOF

      # (Vulkan's drivers are in /run/opengl-driver on NixOS: here, Mesa's software one from the flake's nixpkgs)
      - name: lavapipe
        run: |
          mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa | head -1)"
          echo "VK_DRIVER_FILES=$(find "$mesa" -name 'lvp_icd*.json' | head -1)" >> "$GITHUB_ENV"

      - name: Check, examples, tests (tk ci), the virtual desktop (tk desktop_tests)
        run: |
          export FONTCONFIG_FILE="$(nix build --no-link --print-out-paths .#test-fonts)"
          nix develop --command sh -c '
            set -e
            mkdir -p build
            odin run tools/tk -vet -out:build/tk -- fetch_wgpu
            odin run tools/tk -out:build/tk -- ci
            XORG="sudo $(command -v Xorg)" timeout 480 odin run tools/tk -out:build/tk -- desktop_tests
          '

  wgpu:
    name: WebGPU (${{ matrix.group }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(github.event_name == 'pull_request' && '["sample"]' || '["ci1", "ci2", "ci3", "ci4"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-odin

      # DXC next to the test programs: wgpu compiles the shaders with it in 0.3 s instead of FXC's 2.8 s (a third of the
      # time of a package on WARP); FXC, the fallback when the DLLs are missing, is still run on two packages (ci4)
      - name: Cache DXC
        uses: actions/cache@v6
        with:
          path: |
            build/dxcompiler.dll
            build/dxil.dll
            build/dxc.version
          key: dxc-${{ hashFiles('tools/tk/**') }}

      - name: wgpu-native and DXC (tools/tk fetch_wgpu)
        shell: pwsh
        timeout-minutes: 4
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          odin build tools/tk -vet -out:build/tk.exe
          if ($LASTEXITCODE) { exit 1 }
          ./build/tk.exe fetch_wgpu
          if ($LASTEXITCODE) { exit 1 }

      - name: Emoji font (for tests/colr)
        if: matrix.group == 'ci1'
        shell: pwsh
        timeout-minutes: 3
        run: |
          ./build/tk.exe fetch_emoji -unicode
          if ($LASTEXITCODE) { exit 1 }

      - name: Build examples/smoke with the WebGPU backend
        if: matrix.group == 'ci1' || matrix.group == 'sample'
        shell: pwsh
        timeout-minutes: 4
        run: |
          odin build examples/smoke -vet -define:TOOLKIT_RENDER=wgpu -out:build/smoke_wgpu.exe -subsystem:windows
          if ($LASTEXITCODE) { exit 1 }

      - name: Tests, WebGPU backend (wgpu-native over Direct3D 12 on WARP, one test at a time)
        shell: pwsh
        timeout-minutes: 11
        run: New-Item -ItemType Directory -Force build | Out-Null; odin build tools/run_tests -vet -out:build/run_tests.exe; if ($LASTEXITCODE) { exit 1 }; ./build/run_tests.exe -backend:wgpu -group:${{ matrix.group }} -timeout:420

      - name: Tests, WebGPU backend with FXC (no DXC)
        if: matrix.group == 'ci4'
        shell: pwsh
        timeout-minutes: 4
        run: New-Item -ItemType Directory -Force build | Out-Null; odin build tools/run_tests -vet -out:build/run_tests.exe; if ($LASTEXITCODE) { exit 1 }; ./build/run_tests.exe -backend:wgpu -define:TOOLKIT_WGPU_DX12_COMPILER=fxc -timeout:180 text shaders

      - name: Logs of the WebGPU tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wgpu-logs-${{ matrix.group }}
          path: build/test_logs
          retention-days: 7
