name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # a few seconds: every fragment of changelog.d is well formed and none was already released, ui/version.odin is
      # the last published version (only tools/release.ps1 writes it); then the script's own tests
      - name: CHANGELOG fragments (tools/changelog.ps1 -Check)
        shell: pwsh
        run: |
          ./tools/changelog.ps1 -Check
          if ($LASTEXITCODE) { exit 1 }
          ./tools/changelog_test.ps1
          if ($LASTEXITCODE) { exit 1 }

      - name: Odin dev-2026-10
        shell: pwsh
        env:
          # odin version: dev-2026-10-nightly:84bc3fc (the tag dev-2026-10 is that commit)
          ODIN_TAG: dev-2026-10
          ODIN_SHA256: b6b2e426a8b6f147b74ec7e18bef8df27cf40fe16193159df7ca09a0cc0c2011
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "odin-$env:ODIN_TAG.zip"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest "https://github.com/odin-lang/Odin/releases/download/$env:ODIN_TAG/odin-windows-amd64-$env:ODIN_TAG.zip" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:ODIN_SHA256) { throw "Odin archive SHA-256 mismatch: $got" }
          $dir = Join-Path $env:RUNNER_TEMP 'odin'
          Expand-Archive $zip -DestinationPath $dir -Force
          Add-Content $env:GITHUB_PATH (Join-Path $dir 'dist')
          & (Join-Path $dir 'dist\odin.exe') version

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build the examples
        shell: cmd
        run: |
          for %%e in (fidget todo smoke transforms effects) do (call build.bat %%e || exit /b 1)

      - name: "Shaders (WGSL is the source; naga writes the HLSL, compiled to the DXBC the exes embed)"
        shell: pwsh
        run: |
          ./tools/build_naga.ps1
          if ($LASTEXITCODE) { exit 1 }
          odin run tools/shaders -vet -out:build/shaders_tool.exe -- -check
          if ($LASTEXITCODE) { exit 1 }

      - name: "Emoji font (Noto Color Emoji COLR v1 and Unicode's emoji data, pinned by SHA-256, for tests/colr)"
        shell: pwsh
        run: |
          ./tools/fetch_emoji.ps1 -Unicode
          if ($LASTEXITCODE) { exit 1 }

      - name: Tests (no window; pixel tests on WARP)
        shell: pwsh
        run: |
          $failed = 0
          foreach ($t in 'affine', 'layers', 'effects', 'blend_space', 'gradients', 'shadows', 'retained', 'text', 'color_glyphs', 'masks', 'keyboard', 'status', 'states', 'chrome', 'ui_robust', 'gpufx', 'shaders', 'appshaders', 'slug', 'colr', 'text_backends', 'a11y', 'frame_gate') {
            # @( ) around the if: a statement unwraps a one-element array to a string, and @extra would splat its characters
            $extra = @(if ($t -in 'keyboard', 'status', 'states', 'ui_robust', 'a11y') { '-define:ODIN_TEST_THREADS=1' })
            $o = odin test "tests/$t" -vet @extra -out:"build/${t}_test.exe" 2>&1 | Out-String
            if ($o -match 'All tests were successful') { "PASS $t" } else { "FAIL $t"; $o; $failed++ }
          }
          # the native text backend (Fontations, HarfRust, ICU4X) against DirectWrite on the corpus
          ./tools/build_text.ps1
          if ($LASTEXITCODE) { exit 1 }
          $o = odin test tests/text_backends -vet -define:FONT_BACKEND=native -out:build/text_backends_native_test.exe 2>&1 | Out-String
          if ($o -match 'All tests were successful') { 'PASS text_backends (native)' } else { 'FAIL text_backends (native)'; $o; $failed++ }
          # accessibility: AccessKit's UI Automation adapter, a window read by a UI Automation client (no screen reader)
          ./tools/build_a11y.ps1
          if ($LASTEXITCODE) { exit 1 }
          $o = odin test tests/a11y -vet -define:ODIN_TEST_THREADS=1 -define:A11Y_ACCESSKIT=true -out:build/a11y_uia_test.exe 2>&1 | Out-String
          if ($o -match 'All tests were successful') { 'PASS a11y (UI Automation)' } else { 'FAIL a11y (UI Automation)'; $o; $failed++ }
          odin build tools/uia_probe -vet -out:build/uia_probe.exe
          if ($LASTEXITCODE) { 'FAIL uia_probe'; $failed++ }
          foreach ($tg in 'linux_amd64', 'darwin_arm64') {
            $o = odin check font -target:$tg -no-entry-point -vet 2>&1 | Out-String
            if ($LASTEXITCODE) { "FAIL font on $tg"; $o; $failed++ } else { "PASS font on $tg" }
          }
          # the color glyph tests again with the COLR interpreter in place of Direct2D
          $o = odin test tests/color_glyphs -vet -define:COLR_ENGINE=builtin -out:build/color_glyphs_builtin_test.exe 2>&1 | Out-String
          if ($o -match 'All tests were successful') { 'PASS color_glyphs (builtin)' } else { 'FAIL color_glyphs (builtin)'; $o; $failed++ }
          if ($failed) { exit 1 }

      - name: Tests, WebGPU backend (wgpu-native over Direct3D 12 on WARP, one test at a time)
        shell: pwsh
        run: |
          ./tools/fetch_wgpu.ps1 -NoDxc
          odin build examples/smoke -vet -define:TOOLKIT_RENDER=wgpu -out:build/smoke_wgpu.exe -subsystem:windows
          if ($LASTEXITCODE) { exit 1 }
          ./tools/test_backends.ps1 -Backend wgpu -TimeoutSec 900
          if ($LASTEXITCODE) { exit 1 }
