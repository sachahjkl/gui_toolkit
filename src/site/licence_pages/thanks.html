<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Thank you · {{name}}</title>
  <meta name="description" content="Your license of {{name}}.">
  <link rel="stylesheet" href="{{stylesheet}}">
  <style>
{{shop_css}}  </style>
</head>
<body class="shop-page">
<!-- A template of the toolkit's site package (src/site/licence_pages, docs/licence.md): a program copies it into its site,
     or licence_pages fills it. Its style is gt:site's LICENCE_CSS, drawn from the site's colours. Its legal words are a
     starting point: have them checked for your situation. -->
<header class="shop-top">
  <div class="shop-wrap">
    <a class="shop-brand" href="{{home}}">{{icon_small}}<span>{{name}}</span></a>
    <a class="shop-back" href="{{home}}">Back to {{name}}</a>
  </div>
</header>
<main id="main" class="shop">
<section class="shop-hero">
  {{icon}}
  <h1 class="shop-thanks-title">Thank you for supporting {{name}}</h1>
  <p class="shop-lead">You keep an independent program moving forward. It means a lot. Here is your license.</p>
</section>
<!-- licence-thanks -->
</main>
<footer class="shop-foot">
  <div class="shop-wrap">
    {{footer_nav}}
  </div>
</footer>
</body>
</html>
