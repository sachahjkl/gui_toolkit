<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imprint - {{name}}</title>
  <meta name="description" content="Who sells the {{product_title}}.">
  <link rel="stylesheet" href="{{stylesheet}}">
  <style>
{{shop_css}}  </style>
</head>
<body class="shop-page">
<!-- A template of the toolkit's site package (src/site/licence_pages, docs/licence.md): a program copies it into its site,
     or licence_pages fills it. Its style is gt:site's LICENCE_CSS, drawn from the site's colours. Its legal words are a
     starting point: have them checked for your situation. -->
<header class="shop-top">
  <div class="shop-wrap">
    <a class="shop-brand" href="{{home}}">{{icon_small}}<span>{{name}}</span></a>
    <a class="shop-back" href="{{home}}">Back to {{name}}</a>
  </div>
</header>
<main id="main" class="shop">
<div class="shop-wrap shop-doc">
<h1>Imprint</h1>
<p>{{seller}}<br>
{{seller_address}}</p>
<p>E-mail: <a href="mailto:{{seller_email}}">{{seller_email}}</a><br>
{{seller_vat}}</p>
<p>The licences are sold by Paddle.com Market Ltd, the Merchant of Record of the purchases.</p>
</div>
</main>
<footer class="shop-foot">
  <div class="shop-wrap">
    <nav>
      <a href="{{home}}">{{name}}</a>
      <a href="../pricing/">Pricing</a>
      <a href="../terms/">Terms</a>
      <a href="../refunds/">Refunds</a>
      <a href="../privacy/">Privacy</a>
      <a href="../imprint/" aria-current="page">Imprint</a>
    </nav>
  </div>
</footer>
</body>
</html>
